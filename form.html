<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>form.html</title>
    <style>
        body {
            font-family: serif;
            margin: 20px;
        }
        .outer-container {
            border: 1px solid black;
            padding: 20px;
            max-width: 450px;
        }
        h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 3px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            max-width: 250px;
            padding: 3px;
            box-sizing: border-box;
        }
        textarea {
            height: 60px;
            max-width: 100%;
        }
        .radio-group label,
        .checkbox-group label {
            display: inline;
            font-weight: normal;
            margin-left: 5px;
        }
        .radio-group div,
        .checkbox-group div {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="outer-container">
        <h2>Formulir Pendaftaran</h2>
        
        <form>
            <div class="form-group">
                <label>Nama Lengkap:</label>
                <input type="text" placeholder="Masukkan nama">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" placeholder="nama@email.com">
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password">
            </div>

            <div class="form-group">
                <label>Umur:</label>
                <input type="number" style="max-width: 80px;">
            </div>

            <div class="form-group">
                <label>Tanggal Lahir:</label>
                <input type="date">
            </div>

            <div class="form-group radio-group">
                <label>Jenis Kelamin:</label>
                <div>
                    <input type="radio" id="lk" name="jk">
                    <label for="lk">Laki-laki</label>
                </div>
                <div>
                    <input type="radio" id="pr" name="jk">
                    <label for="pr">Perempuan</label>
                </div>
            </div>

            <div class="form-group checkbox-group">
                <label>Hobi:</label>
                <div>
                    <input type="checkbox" id="coding">
                    <label for="coding">Coding</label>
                </div>
                <div>
                    <input type="checkbox" id="gaming">
                    <label for="gaming">Gaming</label>
                </div>
                <div>
                    <input type="checkbox" id="olahraga">
                    <label for="olahraga">Olahraga</label>
                </div>
            </div>

            <div class="form-group">
                <label>Jurusan:</label>
                <select>
                    <option selected disabled>-- Pilih Jurusan --</option>
                    <option>Teknik Informatika</option>
                    <option>Sistem Informasi</option>
                    <option>Ilmu Komputer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Alamat:</label>
                <textarea placeholder="Masukkan alamat"></textarea>
            </div>

            <div class="form-group">
                <label>Foto:</label>
                <input type="file">
            </div>

            <div class="form-group">
                <label>Website:</label>
                <input type="url" value="https://example.com">
            </div>

            <div class="form-group">
                <button type="submit">Kirim</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

</body>
</html>
